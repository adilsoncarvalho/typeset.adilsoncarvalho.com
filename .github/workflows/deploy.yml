name: Deploy

# Every push to master rebuilds the site, the Typst bundle, the CSS bundle,
# the iA Writer template and the example previews, and publishes them all to
# Pages. A tag additionally attaches a version-stamped copy of the Typst
# bundle and the template to a release — the CSS bundle and the previews are
# site assets, not release artifacts. A pull request runs the checker only,
# so a broken conformance check or a Typst snippet that fails to compile
# blocks the merge instead of the next deploy.
#
# None of the bundles or previews is ever committed: each is derived from
# implementations/ and fonts/, so building them here is the only way they
# cannot drift.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request runs untrusted fork code, so it gets its own cancellable
# queue rather than sharing "pages" with every push and every other PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned to an exact version and checksum: an unpinned or unverified
      # compiler means a snippet can start failing (or a build can run
      # untrusted code) because the toolchain moved, not because the snippet
      # changed. Built for x86_64 Linux, matching this runner.
      - name: Install typst
        env:
          TYPST_VERSION: '0.14.0'
          TYPST_SHA256: '99816d2982de08d2b091bac56b59b2faa523a10e1378ad3cdd68e35b8eb74b3d'
        run: |
          asset="typst-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 --retry-all-errors \
            -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${asset}.tar.xz"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c -
          tar -xf typst.tar.xz
          sudo install -m 755 "${asset}/typst" /usr/local/bin/typst
          rm -rf typst.tar.xz "${asset}"
          typst --version

      # Gate: the committed pages must match what the sources generate, SPEC.md
      # must be current, both implementations must still match spec.json, and
      # every Typst snippet under src/demos compiles under typeset.typ. A pull
      # request stops here — every step below skips on a pull request, so a
      # stale commit or a broken snippet fails before merge rather than shipping.
      - name: Check
        run: node tools/check.mjs

      - name: Build the Typst bundle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node tools/build-bundle.mjs

      - name: Build the CSS bundle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node tools/build-css-bundle.mjs

      - name: Build the iA Writer template
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node tools/build-iawriter.mjs

      # Same condition as "Assemble the site" below, because that is the only
      # step that consumes them: on a tag the site is never assembled, so
      # rendering the previews there is work thrown away.
      - name: Build the example previews
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')
        run: node tools/build-previews.mjs

      # Assembled explicitly rather than uploading the repository root, so the
      # deployed site never contains .git or the workflow itself. Skipped on a
      # tag, which publishes a release rather than a deployment, and on a pull
      # request, which only runs the check above.
      - name: Assemble the site
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')
        with:
          path: _site

  deploy:
    needs: build
    # Branch pushes only. The github-pages environment restricts deployments to
    # the default branch, so running this on a tag fails with "not allowed to
    # deploy to github-pages due to environment protection rules" — and a pull
    # request must never reach a deploy at all. Named allowlist rather than
    # "not a pull request", so a future trigger defaults to no deploy rights.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the Typst bundle
        run: node tools/build-bundle.mjs

      # Not a release asset — see the top-of-file note — but the iA Writer
      # template below consumes typeset.css and the spec fonts from this bundle
      # rather than from the repository root, so it has to exist first.
      - name: Build the CSS bundle
        run: node tools/build-css-bundle.mjs

      - name: Build the iA Writer template
        run: node tools/build-iawriter.mjs

      # Every asset carries the spec version, which is the version that matters:
      # each is an implementation of a numbered specification, and a reader who
      # downloads one needs to know which revision they are holding.
      - name: Name the assets
        run: |
          version=$(node -p "require('./spec.json').version")
          cp downloads/typeset-typst.zip "downloads/typeset-typst-${version}.zip"
          cp downloads/typeset-letter.iatemplate.zip "downloads/typeset-letter-${version}.iatemplate.zip"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "downloads/typeset-typst-${VERSION}.zip"
            "downloads/typeset-letter-${VERSION}.iatemplate.zip"
          )
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "typeset $GITHUB_REF_NAME" \
            --notes "Implementations of typeset spec $VERSION, each carrying every font file.

          - \`typeset-typst-${VERSION}.zip\` — Typst. Compile with \`typst compile --font-path fonts implementations/example-essay.typ out.pdf\`.
          - \`typeset-letter-${VERSION}.iatemplate.zip\` — iA Writer, letter. Ragged right at the 11pt base." \
          || gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
