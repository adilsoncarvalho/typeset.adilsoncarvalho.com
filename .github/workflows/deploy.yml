name: Deploy

# Every push to master rebuilds the site, the Typst bundle and the iA Writer
# template, and publishes them all to Pages. A tag additionally attaches a
# version-stamped copy of each to a release.
#
# None of the bundles is ever committed: each is derived from implementations/
# and fonts/, so building them here is the only way they cannot drift.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Gate: the committed pages must match what the sources generate, SPEC.md
      # must be current, and both implementations must still match spec.json.
      # A stale commit fails here rather than shipping.
      - name: Check
        run: node tools/check.mjs

      - name: Build the Typst bundle
        run: node tools/build-bundle.mjs

      - name: Build the iA Writer template
        run: node tools/build-iawriter.mjs

      # Assembled explicitly rather than uploading the repository root, so the
      # deployed site never contains .git or the workflow itself. Skipped on a
      # tag, which publishes a release rather than a deployment.
      - name: Assemble the site
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/heads/')
        with:
          path: _site

  deploy:
    needs: build
    # Branch pushes only. The github-pages environment restricts deployments to
    # the default branch, so running this on a tag fails with "not allowed to
    # deploy to github-pages due to environment protection rules".
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the Typst bundle
        run: node tools/build-bundle.mjs

      - name: Build the iA Writer template
        run: node tools/build-iawriter.mjs

      # Every asset carries the spec version, which is the version that matters:
      # each is an implementation of a numbered specification, and a reader who
      # downloads one needs to know which revision they are holding.
      - name: Name the assets
        run: |
          version=$(node -p "require('./spec.json').version")
          cp downloads/typeset-typst.zip "downloads/typeset-typst-${version}.zip"
          cp downloads/typeset-letter.iatemplate.zip "downloads/typeset-letter-${version}.iatemplate.zip"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "downloads/typeset-typst-${VERSION}.zip"
            "downloads/typeset-letter-${VERSION}.iatemplate.zip"
          )
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "typeset $GITHUB_REF_NAME" \
            --notes "Implementations of typeset spec $VERSION, each carrying every font file.

          - \`typeset-typst-${VERSION}.zip\` — Typst. Compile with \`typst compile --font-path fonts implementations/example-essay.typ out.pdf\`.
          - \`typeset-letter-${VERSION}.iatemplate.zip\` — iA Writer, letter. Ragged right at the 11pt base." \
          || gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
