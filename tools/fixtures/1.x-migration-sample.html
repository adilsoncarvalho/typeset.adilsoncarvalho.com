<!-- A document written against 1.x class names, one representative token
     from each of the twelve plural groups plus the one frozen section
     rename. tools/check.mjs gate 16a runs tools/codemod-names.mjs over this
     file and requires one run to carry it all the way to 2.0 singular
     names — through the frozen 1.x map and then the singular map — with
     every class it lands on a name this release carries, and a second run
     changing nothing further.

     A token has to stay here for each group the maps rewrite: the gate
     derives the list of groups from the singular map, so a group this file
     stops covering fails the build rather than quietly dropping out of the
     proof.

     ts-link, ts-table, ts-figure and ts-callout end the run spelled exactly
     as they start. Each passes through a doubled 2.0.0 plural spelling
     (ts-links-link and its three siblings) that the singular map collapses
     back to the bare id, and a map that doubled the id instead would chain
     just as cleanly — the round trip is the only thing that tells them
     apart. -->
<article class="typeset">
  <h1 class="ts-h1">On the measure of a line</h1>
  <p class="ts-paragraph">An ordinary paragraph, set with a paragraph rule.</p>
  <p><a class="ts-link" href="#">a link</a></p>
  <p class="ts-frac">3/4 set as a case fraction</p>
  <blockquote class="ts-epigraph">
    <p>A sample epigraph.</p>
  </blockquote>
  <ul class="ts-list-tight">
    <li>one</li>
  </ul>
  <table class="ts-table">
    <tr><td>a cell</td></tr>
  </table>
  <figure class="ts-figure">
    <figcaption>a caption</figcaption>
  </figure>
  <div class="ts-callout">
    <p class="ts-callout-title">Before you send it</p>
  </div>
  <div class="ts-callout--warning">a warning callout</div>
  <hr class="ts-break--asterism">
  <p class="ts-note">a footnote marker</p>
  <span class="ts-tie">a&nbsp;tie</span>
  <!-- figures-numeric is the one section rename the 1.x map already carries. -->
  <p data-section="figures-numeric">figures-numeric</p>
</article>
